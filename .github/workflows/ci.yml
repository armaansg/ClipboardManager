name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build and test (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project ClipboardManager.xcodeproj -scheme ClipboardManager

      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild -project ClipboardManager.xcodeproj -scheme ClipboardManager \
            -destination 'platform=macOS' -derivedDataPath build \
            CODE_SIGN_IDENTITY=- test | tee build/xcodebuild.log | grep -E "Test Case|error:|warning: .*ClipboardManager|BUILD|TEST" || true
          grep -q "TEST SUCCEEDED" build/xcodebuild.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/xcodebuild.log
            build/Logs/Test/*.xcresult
          if-no-files-found: ignore

      - name: Build Release
        run: |
          xcodebuild -project ClipboardManager.xcodeproj -scheme ClipboardManager -configuration Release \
            -derivedDataPath build CODE_SIGN_IDENTITY=- build -quiet
          ls build/Build/Products/Release/ClipboardManager.app
