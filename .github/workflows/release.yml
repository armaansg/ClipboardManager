name: Release

# Push a tag like v1.0.0 to build, package and publish a GitHub Release with the .dmg and .zip attached.
# Add the secrets below to get a Developer ID signed + notarized build; without them the build is ad-hoc signed.
#   MACOS_CERTIFICATE_P12_BASE64  Developer ID Application certificate exported as .p12, base64-encoded
#   MACOS_CERTIFICATE_PASSWORD    password of that .p12
#   SIGNING_IDENTITY              e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   notarytool credentials (app-specific password)
#   SPARKLE_PRIVATE_KEY           (optional) EdDSA private key for appcast signing
#   TAP_GITHUB_TOKEN              (optional) fine-grained PAT with Contents: write on armaansg/homebrew-tap;
#                                 when present the cask there is bumped to this release automatically

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Import Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          HAS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

      - name: Write Sparkle private key
        if: env.HAS_SPARKLE_KEY == 'true'
        env:
          HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_private_key"
          echo "SPARKLE_PRIVATE_KEY_FILE=$RUNNER_TEMP/sparkle_private_key" >> "$GITHUB_ENV"

      - name: Build and package
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPCAST_DOWNLOAD_PREFIX: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/
        run: |
          VERSION="${GITHUB_REF_NAME#v}" BUILD_NUMBER="$GITHUB_RUN_NUMBER" Scripts/release.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Clipboard Manager ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS
            dist/appcast.xml
          body: |
            **Install:** download the `.dmg`, open it, drag Clipboard Manager to Applications, then launch it from Applications.

            If macOS says it cannot verify the app (unsigned build), open **System Settings → Privacy & Security**, scroll down, and click **Open Anyway**.

            Requires macOS 14 Sonoma or later on Apple silicon.

      - name: Update Homebrew cask
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          HAS_TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN != '' }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(grep "ClipboardManager-$VERSION.dmg" dist/SHA256SUMS | awk '{print $1}')
          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/armaansg/homebrew-tap.git" "$RUNNER_TEMP/tap"
          Scripts/update-cask.sh "$RUNNER_TEMP/tap/Casks/clipboard-manager.rb" "$VERSION" "$SHA"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "clipboard-manager $VERSION" || echo "cask already current"
          git push
